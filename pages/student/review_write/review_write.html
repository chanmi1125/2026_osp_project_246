{% extends "core/base.html" %}

{% block title %}리뷰 작성{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='student/review_write/review_write.css') }}">
{% endblock %}

{% block page_title %}
<div class="page-title"><a href="javascript:history.back()" aria-label="뒤로">&lsaquo;</a> 리뷰 작성</div>
{% endblock %}

{% block content %}
<form class="review-form" id="review-form" data-next="{{ url_for('review_list') }}" novalidate>
  <div class="field">
    <label class="field-label" for="writer">작성자 ID <span class="req">*</span></label>
    <input class="input" id="writer" name="writer" placeholder="작성자 ID를 입력하세요" required>
  </div>

  <div class="field">
    <label class="field-label" for="product">상품 이름 <span class="req">*</span></label>
    <input class="input" id="product" name="product" placeholder="상품 이름을 입력하세요" required>
  </div>

  <div class="field">
    <label class="field-label" for="title">리뷰 제목 <span class="req">*</span></label>
    <input class="input" id="title" name="title" placeholder="리뷰 제목을 입력하세요" required>
  </div>

  <div class="field">
    <span class="field-label">평점 <span class="req">*</span></span>
    <div class="stars" role="radiogroup" aria-label="평점">
      {% for n in range(1, 6) %}
      <button class="star" type="button" data-value="{{ n }}" role="radio" aria-checked="false" aria-label="{{ n }}점">&#9733;</button>
      {% endfor %}
    </div>
    <input type="hidden" name="rating" id="rating" value="0">
  </div>

  <div class="field">
    <label class="field-label" for="content">리뷰 내용 <span class="req">*</span></label>
    <textarea class="input textarea" id="content" name="content" placeholder="상품 리뷰를 작성해주세요" required></textarea>
  </div>

  <div class="field">
    <span class="field-label">리뷰 사진 <span class="req">*</span></span>
    <label class="photo-upload" for="photo">
      <img class="photo-preview" id="photo-preview" alt="" hidden>
      <span class="photo-empty" id="photo-empty">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 13a3 3 0 0 1 3-3h5l3-4h8l3 4h5a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><circle cx="20" cy="20" r="6"/></svg>
        사진을 업로드하세요<br>(JPG, PNG)
      </span>
    </label>
    <input type="file" id="photo" name="photo" accept="image/jpeg,image/png" required hidden>
  </div>

  <p class="form-error" id="form-error" hidden>필수 항목을 모두 입력해 주세요.</p>
  <button class="btn btn-primary" type="submit">리뷰 등록하기</button>
</form>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='student/review_write/review_write.js') }}"></script>
{% endblock %}
