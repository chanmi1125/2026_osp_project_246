<div class="drawer-dim" data-menu-close hidden></div>
<nav class="drawer" aria-label="{{ drawer_label }}" hidden>
  <div class="drawer-head">
    <div class="drawer-top">
      <a class="drawer-logo" href="{{ url_for(home_endpoint) }}">이화픽</a>
      <button class="drawer-close" type="button" data-menu-close aria-label="메뉴 닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <a class="drawer-profile" href="{{ url_for(profile_endpoint) }}">
      <span class="avatar" aria-hidden="true"></span>
      <span class="profile-text">
        <strong>{{ session.get('id', profile_name) }}</strong>
        <small>{{ ('사장님 회원' if auth_role == 'owner' else '학생 회원') if session.get('id') else profile_sub }}</small>
        <span class="profile-chip">{{ profile_chip }}</span>
      </span>
    </a>
  </div>
  <ul class="drawer-menu">
    {% for endpoint, label, badge, badge_kind in menu %}
    <li><a href="{{ url_for(endpoint) }}" {% if request.endpoint == endpoint %}class="active" aria-current="page"{% endif %}>
      <span class="menu-label">{{ label }}</span>
      {% if badge %}<span class="badge badge-{{ badge_kind }}">{{ badge }}</span>{% endif %}
      <span class="chevron" aria-hidden="true">&rsaquo;</span>
    </a></li>
    {% endfor %}
  </ul>
  <div class="drawer-foot">
    <form action="{{ url_for('logout') }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="drawer-logout" type="submit">로그아웃</button>
    </form>
  </div>
</nav>
