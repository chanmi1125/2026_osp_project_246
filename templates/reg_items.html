{% extends "index.html" %}
{% block title %}Register Items - EwhaMarket{% endblock %}
{% block content %}
<h1>상품 등록</h1>
<form action="{{ url_for('result') }}" method="POST" enctype="multipart/form-data">
    <label>Product name:
        <input type="text" name="name" required>
    </label>
    <label>Seller ID:
        <input type="text" name="seller_id" required>
    </label>
    <label>Address:
        <input type="text" name="address" required>
    </label>
    <label>Price:
        <input type="number" name="price" min="0" required>
    </label>
    <label>Status?
        <select name="status">
            <option value="Likely New">Likely New</option>
            <option value="Good">Good</option>
            <option value="Used">Used</option>
        </select>
    </label>
    <label>Email:
        <input type="email" name="email" required>
    </label>
    <label>Representative Image upload:
        <input type="file" name="image" accept="image/*" required>
    </label>
    <button type="submit">Submit!</button>
</form>
{% endblock %}
