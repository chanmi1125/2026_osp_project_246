{% extends "index.html" %}
{% block section %}
<form action="/submit_item_post" method="post" enctype="multipart/form-data">
    <div>
        <label for="name">Product name: </label>
        <input type="text" name="name" id="name" required>
    </div>
    <div>
        <label for="seller">Seller ID: </label>
        <input type="text" name="seller" id="seller" required>
    </div>
    <div>
        <label for="addr">Address: </label>
        <input type="text" name="addr" id="addr" required>
    </div>
    <div>
        <label for="price">Price: </label>
        <input type="number" name="price" id="price" min="0" required>
    </div>
    <div>
        <label for="status">Status? </label>
        <br>
        <select id="status" name="status">
            <option value="new" selected>New</option>
            <option value="lnew">Likely New</option>
            <option value="used">Used</option>
        </select>
    </div>
    <div>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" required>
    </div>
    <div>
        <label for="img">Representative Image upload : </label>
        <input type="file" name="file_input" id="img" accept="image/*" required>
    </div>
    <div>
        <input type="submit" value="Submit!">
    </div>
</form>
{% endblock section %}
